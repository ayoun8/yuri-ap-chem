name: Clean Unit 0 wording

on:
  push:
    branches:
      - clean-unit0-wording

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-unit0-wording
      - name: Clean wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unit0-test.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<h2>Fast diagnostic</h2>':'<h2>Quick Check</h2>',
              '<p>Before teaching, start with these seven questions without notes. This tells you where to spend time.</p>':'<p>Try these seven questions without notes before starting the review. Use the results to decide which topics need the most attention.</p>',
              '<b>Diagnostic answers:</b>':'<b>Quick Check answers:</b>',
              '<div class="eyebrow">Student mode</div><h1>Unit 0 Practice Test</h1>':'<div class="eyebrow">Practice</div><h1>Unit 0 Practice Test</h1>',
              '<div class="eyebrow">Student mode</div><h1>Unit 0 Practice Test 2</h1>':'<div class="eyebrow">Practice</div><h1>Unit 0 Practice Test 2</h1>',
              '<div class="teacher"><b>Important rule:</b> Never teach “move the decimal” as the primary method. Teach factor-label first; moving the decimal becomes a shortcut only after she understands why.</div>':'<div class="study-note"><b>Important rule:</b> Use factor-label analysis first. “Moving the decimal” is only a shortcut after the conversion itself makes sense.</div>',
              'Before teaching':'Before starting',
              'Tutor mode':'Study',
              'Teaching rule:':'Important rule:',
              'teacher-tip':'study-tip',
              'class="teacher"':'class="study-note"',
              '.memory,.teacher{':'.memory,.study-note{',
              '.teacher{':'.study-note{'
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Clean student-facing Unit 0 wording
          file_pattern: unit0-test.html
