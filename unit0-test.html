<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Chemistry — Unit 0 Test Hub</title></head><body><div id="loading" style="font:16px system-ui;padding:32px">Loading Unit 0 Study Hub…</div><script>(async()=>{const [a,b]=await Promise.all([fetch('.u0a').then(r=>r.text()),fetch('.u0b').then(r=>r.text())]);const b64=(a+b).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();})().catch(e=>{document.getElementById('loading').textContent='Unable to load the study hub. Please refresh the page.';console.error(e)});</script></body></html>
